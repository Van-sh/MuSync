[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "entity", "migration"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["erased-json", "cookie"] }
axum-macros = "0.5.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
entity = { version = "0.1.0", path = "entity" }
jsonwebtoken = "11.1.0"
migration = { version = "0.1.0", path = "migration" }
sea-orm = { version = "2.0.3", features = ["debug-print"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["add-extension", "compression-full", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde"] }
